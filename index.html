<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Map - Regio Rijnmond</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin=""/>

    <!-- Custom CSS for full-screen map -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            width: 100%;
            font-family: Arial, sans-serif;
        }

        #map {
            height: 100%;
            width: 100%;
        }

        /* Custom popup styling */
        .leaflet-popup-content-wrapper {
            border-radius: 8px;
        }

        .leaflet-popup-content {
            margin: 15px;
            font-size: 14px;
        }

        .popup-title {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 8px;
            color: #2c3e50;
        }

        .popup-description {
            color: #555;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <!-- Map container -->
    <div id="map"></div>

    <!-- Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>

    <!-- Main application script -->
    <script>
        // Initialize the map
        const map = L.map('map').setView([51.9, 4.3], 11);

        // Add OpenStreetMap tile layer
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
            maxZoom: 19,
            minZoom: 3
        }).addTo(map);

        // Function to load and display markers from JSON
        async function loadMarkers() {
            try {
                // Fetch the locations data
                const response = await fetch('locations.json');

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const locations = await response.json();

                // Create a marker for each location
                locations.forEach(location => {
                    // Create marker
                    const marker = L.marker([location.latitude, location.longitude])
                        .addTo(map);

                    // Create popup content with custom styling
                    const popupContent = `
                        <div class="popup-title">${location.name}</div>
                        <div class="popup-description">${location.description}</div>
                    `;

                    // Bind popup to marker
                    marker.bindPopup(popupContent);
                });

                console.log(`Successfully loaded ${locations.length} locations`);

            } catch (error) {
                console.error('Error loading locations:', error);
                alert('Failed to load location data. Please ensure locations.json exists and is properly formatted.');
            }
        }

        // Load markers when page is ready
        document.addEventListener('DOMContentLoaded', loadMarkers);
        loadMarkers();
    </script>
</body>
</html>
